[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "common-studio"
version = "0.1.0"
description = "An open, public-domain music production studio: core model and score representation."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Unlicense" }
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"common_studio.ingest" = ["fixtures/*", "fixtures/works/*/work.yaml"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
